# yamllint disable rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/tasks
# yamllint enable rule:line-length
---
- name: Setup Java
  vars:
    java_opt_dir: "{{ common_opt }}/java"
  block:
    - name: Ensure Java opt Folder
      ansible.builtin.file:
        state: directory
        path: "{{ java_opt_dir }}"
        mode: "755"
      tags:
        - java-debug
        - java-test
        - jdk
        - jdtls
        - lombok

    - name: Download and Install Java
      when: ansible_facts['machine'] == "arm64"
      ansible.builtin.include_tasks: tasks/java/jdk.yml
      loop: "{{ jdk_metadata }}"
      loop_control:
        loop_var: jdk
      tags: jdk
      vars:
        # https://aws.amazon.com/corretto
        jdk_metadata:
          # https://github.com/corretto/corretto-25/releases
          - java_version: 25.0.4
            jdk_version: 25.0.4.10.1
            jdk_sha256: ee05ff1a6a459be34c4e504a206b0cae7c77e42c58424a08408b76c451bdd4ef  # yamllint disable-line rule:line-length
            jdk_archive_name: amazon-corretto-25.0.4.10.1-macosx-aarch64
            is_primary_jdk: true

          # https://github.com/corretto/corretto-21/releases
          - java_version: 21.0.12
            jdk_version: 21.0.12.12.1
            jdk_sha256: 8594556550766865662411ef3a7a71a66df9a9065f28a7b318a5352bda91b6a4  # yamllint disable-line rule:line-length
            jdk_archive_name: amazon-corretto-21.0.12.12.1-macosx-aarch64
            is_primary_jdk: false

          # https://github.com/corretto/corretto-17/releases
          - java_version: 17.0.19
            jdk_version: 17.0.19.10.1
            jdk_sha256: 3ba2ab957f60e33c6164d7330b1f6c9f48b5ffd60e4cc9bbcc67def319c29a29  # yamllint disable-line rule:line-length
            jdk_archive_name: amazon-corretto-17.0.19.10.1-macosx-aarch64
            is_primary_jdk: false

    - name: Eclipse JDT Language Server
      ansible.builtin.import_tasks: tasks/java/jdtls.yml
      tags: jdtls

    - name: Lombok
      ansible.builtin.import_tasks: tasks/java/lombok.yml
      tags: lombok

    - name: Java Test Runner
      ansible.builtin.import_tasks: tasks/java/java-test.yml
      tags: java-test

    - name: Java Debug
      ansible.builtin.import_tasks: tasks/java/java-debug.yml
      tags: java-debug
